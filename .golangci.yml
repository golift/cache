version: '2'
linters:
  default: all
  disable:
    - exhaustruct # deprecated.
    - exhaustruct_v5 # zero values are the config: callers set the fields they use.
    - gomodguard # deprecated.
    - nlreturn
    - depguard
    - wsl
  settings:
    wsl_v5:
      disable:
        - assign
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
